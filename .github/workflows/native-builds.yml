name: Native builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libjpeg-turbo
      - name: Build runtime
        run: make -j2
      - name: Package runtime
        run: tar -czf wtk-ng-windows-x64.tar.gz libwtk-ng.a wt.h README.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wtk-ng-windows-x64
          path: wtk-ng-windows-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install dependencies
        run: brew install sdl2 jpeg-turbo pkgconf
      - name: Configure pkg-config
        run: echo "PKG_CONFIG_PATH=$(brew --prefix jpeg-turbo)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build runtime
        run: make -j2
      - name: Package runtime
        run: tar -czf wtk-ng-macos-${{ matrix.arch }}.tar.gz libwtk-ng.a wt.h README.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wtk-ng-macos-${{ matrix.arch }}
          path: wtk-ng-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14
